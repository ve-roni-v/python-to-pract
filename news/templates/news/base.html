<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'news/style.css' %}">
    <title>{% block title %}Новостной портал{% endblock %}</title>
</head>
<body>
    <div class="container">
        <header>
            {% block header %}
            <h1>Новостной портал</h1>
            <p>Последние новости нашего города</p>
            {% endblock %}
        </header>

        <nav>
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'category' %}">Категории</a>
            <a href="{% url 'about' %}">О нас</a>
            <a href="{% url 'contact' %}">Контакт</a>
        </nav>

        <main class="container">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <footer>
        <p>Учебный проект ITSTEP</p>
    </footer>
</body>
</html>
