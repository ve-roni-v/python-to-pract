<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новостной портал</title>
</head>
<body>
    <header>
        <h1>{{ headline }}</h1>
        <p>Последние новости нашего города</p>
    </header>
    <main>
        <h2>Главная страница</h2>
        <article>
            <h3>{{ title }}</h3>
            <p>{{ text }}</p>
            <p>Автор: {{ author }}</p>
        </article>
    </main>
    <footer>
        <p>Учебный проект ITSTEP</p>
    </footer>
</body>
</html>
